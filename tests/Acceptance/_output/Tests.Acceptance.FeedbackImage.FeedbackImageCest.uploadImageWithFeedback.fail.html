<html lang="pt-br" class="bg-black/10"><!--    class="bg-[url('/assets/images/background/backgrounf.jpg')] bg-cover bg-no-repeat" --><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RU</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/styles.css">

</head>

<body class="min-h-svh">
    

    <nav class="grid grid-cols-2 h-1/10 bg-primary shadow-lg">
                    <a href="javascript:history.back()" class="justify-self-start self-center">
                <i class="fa-solid fa-left-long px-6 text-4xl text-white"></i>
            </a>
        
        <i class="fa-solid fa-bars px-6 text-4xl text-white justify-self-end self-center col-start-2" id="open-menu"></i>

        <ul class="hidden absolute h-screen w-4/5 bg-secondary top-0 right-0 px-8 py-4 flex-col justify-start items-start gap-4" id="menu-list">
            <li id="close-menu" class="flex items-center gap-2 text-white">
                <i class="fa-solid fa-xmark text-2xl"></i>
            </li>
            <li class="flex items-center gap-2 text-white">
                <i class="fa-regular fa-circle-user text-2xl"></i>
                <p>Perfil</p>
            </li>
            <li class="flex items-center gap-2 text-white">
                <a class="flex items-center gap-2" href="/feedbacks">
                    <i class="fa-regular fa-message text-2xl"></i>
                    <p>Feedback's</p>
                </a>
            </li>
            <li class="flex items-center gap-2 text-white">
                <a class="flex items-center gap-2" href="/logout">
                    <i class="fa-solid fa-arrow-right-from-bracket text-2xl"></i>
                    <p>Sair</p>
                </a>
            </li>
        </ul>
    </nav>

    <form action="/feedbacks/user/create" method="POST" enctype="multipart/form-data" class="flex flex-col gap-6 items-start w-3/4 mx-auto text-black py-4">

    <h1 class="text-center w-full rf-2xl mb-0 pb-0 font-ws text-primary/75 font-bold">
        Fazer uma avaliação    </h1>

    <div class="w-full">
        <h2 class="rf-md mb-2">Tipo *</h2>
        <select name="feedback[type]" class="default-input w-full" id="feedback-type-select">
            <option value="">Selecione</option>

                            <option value="complaint">
                    Reclamação                </option>
                            <option value="compliment">
                    Elogio                </option>
                            <option value="question">
                    Pergunta                </option>
                            <option value="suggestion">
                    Sugestão                </option>
            
        </select>
    </div>

    <div class="w-full justify-center flex-col hidden" id="avaliacao-feedback">
        <h3 class="rf-md mb-2 text-start">Avaliação</h3>
        <div class=" flex justify-between w-full">

                            <label for="rating-1" class="text-3xl">
                    <i class="fa-regular fa-star text-yellow-600 rating-star rating-star-1" data-value="1"></i>
                </label>
                <input type="radio" name="feedback[rating]" id="rating-1" value="1" class="hidden">
                            <label for="rating-2" class="text-3xl">
                    <i class="fa-regular fa-star text-yellow-600 rating-star rating-star-2" data-value="2"></i>
                </label>
                <input type="radio" name="feedback[rating]" id="rating-2" value="2" class="hidden">
                            <label for="rating-3" class="text-3xl">
                    <i class="fa-regular fa-star text-yellow-600 rating-star rating-star-3" data-value="3"></i>
                </label>
                <input type="radio" name="feedback[rating]" id="rating-3" value="3" class="hidden">
                            <label for="rating-4" class="text-3xl">
                    <i class="fa-regular fa-star text-yellow-600 rating-star rating-star-4" data-value="4"></i>
                </label>
                <input type="radio" name="feedback[rating]" id="rating-4" value="4" class="hidden">
                            <label for="rating-5" class="text-3xl">
                    <i class="fa-regular fa-star text-yellow-600 rating-star rating-star-5" data-value="5"></i>
                </label>
                <input type="radio" name="feedback[rating]" id="rating-5" value="5" class="hidden">
            
        </div>
    </div>

    <div class="w-full">
        <label for="message_content" class="rf-md mb-2">Descrição *</label>
        <textarea name="message[content]" id="message_content" class="default-input w-full min-h-28" placeholder="Forneça detalhes desta avaliação"></textarea>
    </div>

    <div>
        <label for="image_content">Imagem</label>
        <input type="file" name="images[]" id="image_content" multiple="">
    </div>

    <div class="w-full hidden" id="danos-a-saude">
        <h2 class="rf-md mb-2">Pode causar danos à saúde? *</h2>
        <div class="flex justify-center gap-8 btn-group">
            <label for="is-harmfull-yes" class="btn-md-outline-primary btn-choice shadow-lg">
                Sim
            </label>
            <input type="radio" name="feedback[is_harmfull]" id="is-harmfull-yes" value="1" class="hidden">

            <label for="is-harmfull-no" class="btn-md-outline-primary btn-choice shadow-lg">
                Não
            </label>
            <input type="radio" name="feedback[is_harmfull]" id="is-harmfull-no" value="0" class="hidden">
        </div>
    </div>

    <button type="submit" class="btn-md bg-primary w-full">Criar</button>

</form>

<script src="/assets/js/Controllers/user.js" type="module"></script>
<script src="/assets/js/Controllers/feedback.js" type="module"></script>

</body></html>
